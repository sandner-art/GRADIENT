# gradient-project-root/config/default_settings.yaml
app:
  host: "127.0.0.1"
  port: 8000
  reload: false # <--- ADD THIS LINE

logging:
  level: "INFO"

# config of model paths

paths:
  models:
    # Define base search directories. Order might matter.
    # Paths can be relative (to project root) or absolute.
    search_dirs:
      - "./data/models" # Default relative path
      # - "/mnt/extra_storage/ai_models" # Example absolute path on Linux
      # - "D:/ai_models"                  # Example absolute path on Windows
    # Specific subdirs within search paths (can keep defaults)
    diffusers: "diffusers"
    checkpoints: "checkpoints"
    vae: "vae"
    llm: "llm"
    lora: "lora"
    controlnet: "controlnet"
    embeddings: "embeddings"  