# gradient-project-root/config/default_settings.yaml
#
# Defaults for GRADIENT. Do not edit this file for local changes:
# put overrides into config/config.yaml (same structure) or use environment
# variables (see .env.example).

app:
  host: "127.0.0.1"
  port: 8000
  reload: false
  # Serve the built web UI (frontend/build) from the API server, so a single
  # `gradient` command gives you the whole app at http://127.0.0.1:8000
  serve_frontend: true
  open_browser: false

logging:
  level: "INFO"

paths:
  # Where experiment outputs (images + metadata) are written. Relative paths
  # are resolved against the project root.
  outputs: "./experiments"
  data: "./data"
  models:
    # Base search directories, in priority order. The FIRST entry is also where
    # the built-in model downloader stores new models.
    # Paths can be relative (to the project root) or absolute.
    # The GRADIENT_MODEL_DIR environment variable is prepended if set.
    search_dirs:
      - "./data/models"
      # - "/mnt/extra_storage/ai_models"   # Linux example
      # - "D:/ai_models"                    # Windows example
    # Sub-directories inside each search dir (keep the defaults unless you
    # share folders with another app).
    diffusers: "diffusers"
    checkpoints: "checkpoints"
    vae: "vae"
    llm: "llm"
    lora: "lora"
    controlnet: "controlnet"
    embeddings: "embeddings"
    vision: "vision"          # feature encoders (DINOv3/DINOv2) for Lab measurements

performance:
  # Device override: null (auto: cuda > mps > xpu > cpu), "cuda", "cuda:1", "mps", "cpu" ...
  device: null
  # How diffusion models are placed in memory:
  #   auto     - pick based on model size vs. free VRAM (recommended)
  #   gpu      - whole pipeline on the GPU (fastest, most VRAM)
  #   balanced - diffusers model CPU offload (moves whole components on demand)
  #   low      - group offload with CUDA stream prefetching (slower, very low VRAM)
  #   minimal  - sequential CPU offload (slowest, lowest VRAM)
  memory_mode: "auto"
  # How many base pipelines to keep loaded at once (LRU eviction beyond this).
  max_cached_pipelines: 1
  # Decode with VAE tiling when width*height exceeds this many pixels.
  vae_tiling_min_pixels: 1572864   # ~1536x1024
  # Optional diffusers attention backend, e.g. "flash", "sage", "_native_cudnn".
  # null keeps PyTorch SDPA (a good default everywhere).
  attention_backend: null

lab:
  # Vision encoder for token ablation distances (name in models/vision or a Hub id).
  # DINOv3 is gated by Meta; GRADIENT falls back to facebook/dinov2-small if unavailable.
  feature_model: "facebook/dinov3-vits16-pretrain-lvd1689m"

downloads:
  catalog_file: "./config/model_catalog.yaml"
  # Max parallel model downloads.
  max_concurrent: 2
  # Refuse to start a download that would leave less free disk space than this.
  min_free_disk_gb: 2
  # Hugging Face token for gated models (FLUX.1-dev, SD 3.5 ...). Prefer the
  # HF_TOKEN environment variable or `hf auth login` over storing it here.
  hf_token: null
  # Optional Civitai API token for direct-URL downloads (or CIVITAI_TOKEN env).
  civitai_token: null
