# GRADIENT model catalog - curated models for one-click download (Models tab / `gradient models catalog`).
# Verified against the Hugging Face API on 2026-10-30 for diffusers 0.42.1 / transformers 5.x / llama-cpp-python 0.3.x.
#
# Add your own entries freely (same schema). Fields:
# - type: diffusers | checkpoints | vae | lora | controlnet | embeddings | llm  (decides the target folder)
# - allow_patterns / ignore_patterns: passed to huggingface_hub.snapshot_download (fnmatch globs, "*" matches "/").
#   Large repos use allow-lists so new upstream files are not downloaded by surprise.
# - files: exact repo-relative filenames for single-file downloads (LoRA, GGUF, checkpoints).
# - pipeline: diffusers class used to load the entry (informational for lora/llm).
# - variant: weight variant passed to from_pretrained (only when the files exist).
# - size_gb: decimal GB (1e9 bytes) actually downloaded with the patterns above.
# - min_vram_gb: rough minimum with all components on the GPU and no offload. GRADIENT's
#   performance.memory_mode: auto offloads to system RAM, so most models run on much smaller GPUs (slower).
# - gated: true -> accept the licence on huggingface.co and provide a token (HF_TOKEN or `hf auth login`).
# - defaults: recommended generation settings; the UI can apply them when you pick the model.
version: 1
models:

  # ---------------------------------------------------------------------------
  # 1. Base text-to-image pipelines (diffusers format)
  # ---------------------------------------------------------------------------

  - id: sd15
    name: "Stable Diffusion 1.5"
    type: diffusers
    family: sd15
    source: huggingface
    repo_id: stable-diffusion-v1-5/stable-diffusion-v1-5
    revision: main
    files: null
    allow_patterns:
      - "model_index.json"
      - "scheduler/*"
      - "tokenizer/*"
      - "feature_extractor/*"
      - "*/config.json"
      - "*.fp16.safetensors"
    ignore_patterns: null
    variant: fp16
    torch_dtype: float16
    gated: false
    license: creativeml-openrail-m
    size_gb: 2.74
    min_vram_gb: 4
    pipeline: StableDiffusionPipeline
    base_model_family: null
    defaults: {width: 512, height: 512, steps: 30, guidance_scale: 7.5}
    tags: [text-to-image, recommended, low-vram, classic]
    description: "The classic 512px latent diffusion model and the base of a huge LoRA/ControlNet ecosystem; runs on almost any GPU."
    homepage: https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5
    verified: true
    notes: >-
      The original runwayml/stable-diffusion-v1-5 repo was removed. This is the maintained mirror, and its files match
      the original. The patterns skip the 4-7.7 GB root .ckpt/.safetensors, all .bin, non_ema and fp32 weights.
      Includes the fp16 safety_checker (0.61 GB). To skip it, also drop "feature_extractor/*" and pass
      safety_checker=None, feature_extractor=None (download becomes ~2.13 GB).

