# gradient-project-root/config/logging_config.yaml
# Version 3 - Let Uvicorn handle its own access log format

version: 1
disable_existing_loggers: false

formatters:
  # Only define the default formatter now
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  # Handler for general logs to the console
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout

  # Handler for general logs to a rotating file
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: default # Use the default format for file logs
    level: DEBUG
    filename: logs/gradient.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  # --- Removed access_console handler ---

loggers:
  # Logger for *your* application code (src/gradient/...)
  gradient:
    handlers: [console, file]
    level: DEBUG
    propagate: no

  # Logger for general Uvicorn messages (startup, shutdown, errors)
  # We send these to our standard handlers
  uvicorn:
    handlers: [console, file]
    level: INFO
    propagate: no # Prevent propagation to root for these messages
  uvicorn.error:
    handlers: [console, file]
    level: INFO
    propagate: no # Prevent propagation to root

  # Logger specifically for Uvicorn access logs (HTTP requests)
  uvicorn.access:
      handlers: [] # <-- REMOVE custom handlers here
      level: INFO
      propagate: no # <-- Keep this as False

# Root logger
root:
  handlers: [console, file]
  level: WARNING