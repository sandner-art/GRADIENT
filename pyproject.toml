# gradient-project-root/pyproject.toml
#
# Standard PEP 621 metadata: works with uv, pip, and Poetry >= 2.
#
# PyTorch note: `torch` is listed without an index URL on purpose. The installer
# scripts (install.sh / install.ps1) pick the right build for your hardware
# (CUDA 13.x, ROCm, Apple MPS or CPU) before installing this package.
# See README.md -> "Installation" for manual instructions.

[project]
name = "gradient-workbench"
version = "0.4.0"
description = "GRADIENT: Generative Research & Architectural Diffusion Interactive Exploration Navigation Toolkit"
authors = [{ name = "Daniel Sandner", email = "news@sandner.art" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Artistic Software",
]
dependencies = [
    # --- Web/API ---
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    # --- AI core ---
    "torch>=2.14",
    "diffusers>=0.42.1",
    "transformers>=5.22",
    "accelerate>=1.15",
    "peft>=0.21",
    "huggingface_hub>=2.4",
    "safetensors>=0.8",
    "sentencepiece>=0.2",   # T5 tokenizers (SD3, FLUX)
    "protobuf>=6",
    "pillow>=12",
    # --- Research / viz ---
    "numpy>=2.3",
    "scikit-learn>=1.9",
    "umap-learn>=0.5.12",
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
]

[project.optional-dependencies]
# Local GGUF chat models. Prebuilt GPU wheels: see README ("LLM support").
llm = ["llama-cpp-python>=0.3.36"]
# Optional quantization backends for large DiT models (FLUX, SD3.5, Qwen-Image) on smaller GPUs.
quant = [
    "bitsandbytes>=0.50; sys_platform != 'darwin'",
    "torchao>=0.18",
    "gguf>=0.19",
]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[project.scripts]
gradient = "gradient.cli:main"

[project.urls]
Repository = "https://github.com/sandner-art/gradient"
Documentation = "https://github.com/sandner-art/gradient/tree/main/docs"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "gradient", from = "src" }]

# --- Tool configuration ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "scripts/legacy", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "ASYNC"]
ignore = [
    "E501",   # line length is handled by the formatter
    "E701",   # legacy code uses compact one-line statements
    "E702",
    "B008",   # FastAPI Depends()/Body() in defaults is idiomatic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
