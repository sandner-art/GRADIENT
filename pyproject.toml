# gradient-project-root/pyproject.toml

[tool.poetry]
name = "gradient-workbench"
version = "0.1.0"
description = "GRADIENT: Generative Research & Architectural Diffusion Interactive Exploration Navigation Toolkit"
authors = ["Daniel Sandner <news@sandner.art>"] # Replace with actual email
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sandner-art/gradient" # Replace with actual repo URL
documentation = "https://github.com/sandner-art/gradient/wiki" # Replace if docs hosted elsewhere
packages = [
    { include = "gradient", from = "src" },
]

# --- Define PyTorch CUDA 12.1 Source --- vvv
[[tool.poetry.source]]
name = "pytorch_cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"
# --- Define PyTorch CUDA 12.1 Source --- ^^^

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
PyYAML = "^6.0"
python-dotenv = "^1.0.0"

# --- Add AI Core Libraries --- vvv
torch = { version = "~2.5.0", source = "pytorch_cu121" } # Allows >=2.5.0, <2.6.0 from cu121 source
torchvision = { version = "~0.20.0", source = "pytorch_cu121" } # Allows >=0.20.0, <0.21.0 from cu121 source
torchaudio = { version = "~2.5.0", source = "pytorch_cu121" } # Allows >=2.5.0, <2.6.0 from cu121 source
diffusers = "^0.29.0"
transformers = "^4.41.0" # Diffusers often depends on this
llama-cpp-python = "^0.2.79" # Check for latest compatible version
# --- Add AI Core Libraries --- ^^^
umap-learn = "^0.5.7"
numpy = "^2.2.5"
scikit-learn = "^1.6.1"
sqlalchemy = "^2.0.40"
alembic = "^1.15.2"
greenlet = "^3.2.1"
aiosqlite = "^0.21.0"
peft = "^0.15.2"
accelerate = "^1.6.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.5.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Tool Configurations
[tool.ruff]
line-length = 88
select = ["E", "W", "F", "I", "UP", "B", "C4", "ASYNC"] # Select rules (Error, Warning, Pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions, flake8-async)
ignore = ["E501"] # Ignore line length errors (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"] # Add src to PYTHONPATH for tests

# Optional: Define scripts if needed (e.g., for CLI)
# [tool.poetry.scripts]
# gradient = "gradient.__main__:app" # Example if using Typer/Click in __main__.py