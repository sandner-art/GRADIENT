# gradient-project-root/.github/workflows/python-app.yml
name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install CPU PyTorch and GRADIENT
        run: |
          uv venv .venv
          uv pip install --python .venv "torch>=2.15" --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test (offline, CPU, tiny random models + fake Hugging Face Hub)
        run: .venv/bin/python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Storybook build + story tests
        run: |
          npx playwright install --with-deps chromium
          npm run build-storybook
          npm run test:storybook
