# gradient-project-root/.github/workflows/python-app.yml

name: Python Application CI

on:
  push:
    branches: [ "main", "develop" ] # Trigger on push to main or develop
  pull_request:
    branches: [ "main", "develop" ] # Trigger on PRs targeting main or develop

permissions:
  contents: read

jobs:
  build_lint_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Test against supported Python versions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Cache dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install Poetry if pyproject.toml uses it (adapt if using other managers)
        pip install poetry
        poetry install --with dev --no-interaction --no-ansi # Install dev dependencies

    - name: Lint with Ruff
      run: |
        poetry run ruff check .
        poetry run ruff format --check . # Check formatting

    - name: Test with pytest
      run: |
        poetry run pytest